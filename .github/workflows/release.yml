name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the book
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Confirm the tag matches the book version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF: ${{ github.ref }}
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; const version = JSON.parse(readFileSync('package.json','utf8')).version; const expected = 'refs/tags/v' + version; if (process.env.REF !== expected) { console.error('Tag ' + process.env.REF + ' does not match package version v' + version); process.exit(1); }"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test

      - name: Build the app
        run: npm run build

      - name: Package for this computer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          publish="${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}"
          if [ "$publish" = "never" ]; then
            npx electron-builder --publish never
            exit 0
          fi
          # The three computers publish at the same time. Retry if GitHub is still creating the release.
          for attempt in 1 2 3 4 5; do
            npx electron-builder --publish always && exit 0
            echo "Publish attempt $attempt did not finish. Waiting, then trying again."
            sleep $((attempt * 20))
          done
          exit 1
